<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Sanga Fortune · Scott's</title>
<meta name="robots" content="noindex">
<link rel="icon" href="../img/logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,900&family=Figtree:wght@500;700&display=swap">
<style>
:root{--r:#D71E28;--c:#FFF1DC;--k:#1B1713}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--r);color:var(--c);font-family:Figtree,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px 16px;text-align:center}
.box{max-width:440px;width:100%}
img.logo{width:200px;filter:brightness(0) invert(94%) sepia(10%) saturate(400%);margin-bottom:28px}
h1{font-family:Fraunces,serif;font-weight:900;font-size:44px;line-height:1;margin:0 0 14px}
p{font-size:17px;line-height:1.5;margin:0 0 26px;opacity:.95}
.btns{display:grid;gap:12px}
button,a.btn{font:700 18px Figtree,sans-serif;border:0;border-radius:999px;padding:17px 22px;cursor:pointer;background:var(--c);color:var(--r);text-decoration:none;display:block}
button.ghost,a.ghost{background:transparent;color:var(--c);border:2px solid var(--c)}
.card{background:var(--c);color:var(--k);border-radius:24px;padding:30px 24px;margin-bottom:22px;animation:pop .5s ease}
.card .k{font:700 12px Figtree;letter-spacing:.25em;color:var(--r);text-transform:uppercase}
.card h2{font-family:Fraunces,serif;font-weight:900;font-size:30px;line-height:1.08;color:var(--r);margin:12px 0 14px}
.card .s{font-size:15px;color:#5b524a;margin:0}
.card .s b{color:var(--k)}
.cookie{font-size:64px;display:block;margin-bottom:6px;animation:shake 1s ease infinite}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
[hidden]{display:none!important}
small{display:block;margin-top:22px;opacity:.7;font-size:12px}
</style>
</head>
<body>
<div class="box">
  <img class="logo" src="../img/logo.png" alt="Scott's">

  <div id="s1">
    <h1>Your sanga fortune awaits.</h1>
    <p>The universe has a message for you today. First, tell us who's asking.</p>
    <div class="btns">
      <button data-g="he">I'm a guy</button>
      <button data-g="she">I'm a girl</button>
      <button class="ghost" data-g="any">Just tell me</button>
    </div>
  </div>

  <div id="s2" hidden>
    <span class="cookie">🥪</span>
    <h1>Reading the crumbs…</h1>
    <p>Hold tight.</p>
  </div>

  <div id="s3" hidden>
    <div class="card">
      <span class="k">Today's fortune</span>
      <h2 id="msg"></h2>
      <p class="s">Your lucky sanga: <b id="sanga"></b></p>
    </div>
    <div class="btns">
      <a class="btn" href="../account.html">Claim 20 free points →</a>
      <button class="ghost" id="again">Another fortune</button>
    </div>
    <small>Just for fun. Screenshot it and tag @scotts_luncheonette_bar</small>
  </div>
</div>
<script>
var A={
 he:["Someone special is about to notice you","A good surprise is heading your way","Someone is quietly impressed by you","Your confidence is about to pay off","Luck is following you around","Someone will remember your smile","A great chat is waiting for you","Your next big win is close","Someone thinks you're a legend","Good energy is coming your way","A new friend is about to appear","Someone will text you with good news","The right person is closer than you think","Your hard work is about to show","A happy coincidence is coming","You're about to make someone's day","Someone admires the way you treat people","A door you've been waiting on is opening","Your vibe today is unbeatable","Big things are lining up for you"],
 she:["You're looking beautiful today","Someone special is about to notice you","Your glow is turning heads","A lovely surprise is heading your way","Someone is thinking about your smile","The right person is closer than you think","Good news is on its way to you","Your kindness is about to come back to you","Someone will compliment you before the week ends","Luck is following you around","A beautiful moment is waiting for you","Someone thinks you're amazing","A message you've been waiting for is coming","Your confidence is magnetic right now","A new adventure is about to begin","Someone is grateful you exist","Your energy is lighting up the room","Something you hoped for is getting closer","You're about to make a great memory","Big things are lining up for you"],
 any:["Today is your lucky day","You will meet someone special soon","Someone is thinking about you right now","A good surprise is heading your way","You're doing better than you think","Good news is on its way","Someone admires you more than you know","Luck is following you around","A happy coincidence is coming","The right person is closer than you think","Your smile is about to make someone's day","A new friend is about to appear","Something you hoped for is getting closer","Your kindness is coming back to you","Big things are lining up for you","Someone will compliment you soon","A great memory is about to happen","Your hard work is about to pay off","The universe is on your side today","Good energy is coming your way"]};
var B=["— and it starts this week.","— so keep your eyes up.","— trust it.","— say yes to it.","— you've earned it.","— smile, it's working.","— don't be shy about it.","— probably before Sunday.","— and it'll be worth it.","— right after a good sanga.","— so treat yourself today.","— you'll know it when you see it.","— enjoy every bit of it.","— and you deserve it.","— big time.","— starting today."];
var g="any";
function seen(){try{return JSON.parse(localStorage.getItem("fseen")||"[]")}catch(e){return []}}
function next(){var a=A[g],s=seen(),tries=0,k,i,j;do{i=Math.floor(Math.random()*a.length);j=Math.floor(Math.random()*B.length);k=g+i+"_"+j;tries++;}while(s.indexOf(k)>-1&&tries<400);
 s.push(k);if(s.length>300)s=s.slice(-300);try{localStorage.setItem("fseen",JSON.stringify(s))}catch(e){}return a[i]+" "+B[j];}function pick(a){return a[Math.floor(Math.random()*a.length)];}
function $(i){return document.getElementById(i);}
function show(){ $("s1").hidden=true;$("s3").hidden=true;$("s2").hidden=false;
 setTimeout(function(){$("msg").textContent=next();$("sanga").textContent=pick(S);$("s2").hidden=true;$("s3").hidden=false;},1400);}
document.querySelectorAll("[data-g]").forEach(function(b){b.onclick=function(){g=b.dataset.g;show();};});
$("again").onclick=show;
</script>
</body>
</html>
